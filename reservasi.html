<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservasi Pink Beach Tour</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Form Reservasi Pink Beach Tour</h1>

<form>

<!-- Hidden ID Partner -->
<input type="hidden" name="id_partner" value="PB12345">

<h2>Data Keamanan</h2>

<label>Buat PIN (6 digit)</label>
<input type="password" name="pin" pattern="[0-9]{6}" maxlength="6" required>

<h2>Lokasi Penjemputan</h2>

<label>Pilih Lokasi</label>
<select name="lokasi">
<option value="">-- Pilih Lokasi --</option>
<option>Bali - Bandara Ngurah Rai</option>
<option>Lombok - Bandara Internasional</option>
<option>Labuan Bajo - Meeting Point Pelabuhan</option>
</select>

<h2>Detail Keberangkatan</h2>

<label>Cari Paket Wisata</label> 
<input type="search" placeholder="Contoh: Labuan Bajo">
<label>Tanggal Keberangkatan</label> 
<input type="date">
<label>Jam Berkumpul</label>
<input type="time">
<label>Jumlah Peserta</label>
<input type="number" min="1" max="20">

<h2>Preferensi Personal</h2>

<label>Link Profil Media Sosial</label>
<input type="url" placeholder="https://instagram.com/username">

<label>Warna Kaos Grup</label>
<input type="color">

<h2>Metode Pembayaran</h2>

<input type="radio" name="pembayaran" value="full"> Full Payment
<br>
<input type="radio" name="pembayaran" value="dp"> DP 50%

<h2>Fasilitas Ekstra</h2>

<input type="checkbox" name="extra" value="asuransi"> Asuransi Perjalanan<br>
<input type="checkbox" name="extra" value="kamera"> Sewa Kamera<br>
<input type="checkbox" name="extra" value="romantis"> Paket Dinner Romantis

<h2>Upload Identitas</h2>

<label>Upload KTP / Paspor</label>
<input type="file">

<br><br>

<button type="submit">Pesan Sekarang</button>

</form>

</div>

</body>
</html>
